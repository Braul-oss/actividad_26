spring.application.name=api-reportes
server.port=${PORT:8095}

# --- Base de datos ---
# Local: H2 en archivo con compatibilidad PostgreSQL.
# Nube: definir DB_URL, DB_USER y DB_PASSWORD (PostgreSQL administrado) como variables de entorno.
spring.datasource.url=${DB_URL:jdbc:h2:file:./datos/reportes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Archivos ---
# El limite de 5 MB se valida aqui y otra vez en el servicio.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.almacenamiento.directorio=${STORAGE_DIR:./almacenamiento/evidencias}
app.almacenamiento.url-firmada-minutos=10

# --- Seguridad ---
# La llave NUNCA va en la app movil ni en el repositorio: se lee de la variable JWT_SECRET
# (en la nube, desde Secret Manager). Si no existe, se genera una aleatoria al arrancar.
app.jwt.secreto=${JWT_SECRET:}
app.jwt.access-minutos=30
app.jwt.refresh-dias=7
app.login.max-intentos=5
app.login.ventana-minutos=15
app.limite.solicitudes-por-minuto=60
app.cors.origenes=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# No exponer detalles internos en los errores
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.mvc.problemdetails.enabled=false
logging.level.mx.edu.utvt=INFO
